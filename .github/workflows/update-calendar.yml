name: Update release calendar

on:
  schedule:
    # Runs once a day at 09:00 UTC. Adjust as you like.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py 3 docs/releases.ics

      - name: Commit updated calendar
        run: |
          git config user.name "release-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/releases.ics
          git diff --cached --quiet || git commit -m "Update releases.ics"
          git push
